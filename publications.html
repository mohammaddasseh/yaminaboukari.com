<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<title>Publications · Yamina Boukari</title>
</head>
<body data-page="pubs">
<header class="hero" style="padding:72px 0 32px">
  <div class="wrap">
    <span class="eyebrow">Google Scholar · ORCID</span>
    <h1 class="serif" style="font-size:clamp(2.4rem,5vw,3.6rem)">Publications</h1>
    <p class="lead" style="margin:0">Journal articles, commentaries, preprints and conference abstracts from 2014 onwards. Citation counts from Google Scholar, <span id="asof"></span>.</p>
  </div>
</header>
<div class="toolbar"><div class="wrap">
  <input class="search" id="q" type="search" placeholder="Search titles, co-authors or journals…" aria-label="Search publications">
  <div class="chips" id="themes"></div>
  <div class="chips" id="types"></div>
</div></div>
<main class="wrap">
  <p class="count" id="count"></p>
  <div id="list"></div>
</main>
<script src="data.js"></script>
<script src="site.js"></script>
<script>
  document.getElementById("asof").textContent = SITE.stats.asOf;
  const st = { q: "", theme: "all", type: "all", first: false, sort: "year" };
  const chips = (el, items, key) => {
    el.innerHTML = items.map(([v, l]) => `<button class="chip" data-v="${v}" aria-pressed="${st[key] === v}">${l}</button>`).join("");
    el.onclick = e => { const b = e.target.closest(".chip"); if (!b) return; st[key] = b.dataset.v; el.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b)); render(); };
  };
  chips(document.getElementById("themes"), [["all", "All topics"], ...Object.entries(SITE.themes)], "theme");
  const types = [...new Set(SITE.pubs.map(p => p.type))];
  const tEl = document.getElementById("types");
  chips(tEl, [["all", "All types"], ...types.map(t => [t, { Commentary: "Commentaries", Thesis: "Thesis" }[t] || t + "s"])], "type");
  tEl.insertAdjacentHTML("beforeend", `<button class="chip" id="first" aria-pressed="false">First author only</button>
    <select class="sel" id="sort" aria-label="Sort"><option value="year">Newest first</option><option value="cites">Most cited</option></select>`);
  document.getElementById("first").onclick = e => { e.stopPropagation(); st.first = !st.first; e.target.setAttribute("aria-pressed", st.first); render(); };
  document.getElementById("sort").onchange = e => { st.sort = e.target.value; render(); };
  document.getElementById("sort").onclick = e => e.stopPropagation();
  document.getElementById("q").oninput = e => { st.q = e.target.value.toLowerCase().trim(); render(); };

  function render() {
    let r = SITE.pubs.filter(p =>
      (st.theme === "all" || p.theme === st.theme) &&
      (st.type === "all" || p.type === st.type) &&
      (!st.first || isFirst(p)) &&
      (!st.q || (p.t + " " + p.a + " " + p.v).toLowerCase().includes(st.q)));
    document.getElementById("count").textContent = `Showing ${r.length} of ${SITE.pubs.length}`;
    const list = document.getElementById("list");
    if (!r.length) { list.innerHTML = '<div class="empty">No publications match these filters.</div>'; return; }
    if (st.sort === "cites") { list.innerHTML = r.slice().sort((a, b) => b.c - a.c).map(pubCard).join(""); }
    else {
      const by = {}; r.forEach(p => (by[p.y] ||= []).push(p));
      list.innerHTML = Object.keys(by).sort((a, b) => b - a).map(y => `<h3 class="year-h">${y}</h3>` + by[y].map(pubCard).join("")).join("");
    }
    observeReveal();
  }
  render();
</script>
</body>
</html>
